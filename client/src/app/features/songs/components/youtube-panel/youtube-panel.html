<div class="panel-youtube" [class.open]="open">
  <div class="panel-header">
    Video Tutorial
  </div>

  <div class="youtube-content">
    <div class="youtube-controls">
      <input type="text" [(ngModel)]="youtubeUrl" placeholder="Pega aquí el enlace de YouTube" />

      <button type="button" class="btn btn-primary btn-small" (click)="loadYoutubeVideo()">
        Cargar
      </button>
    </div>

    <div class="youtube-player">
      @if (videoUrl) {
      <iframe width="100%" height="100%" [src]="videoUrl" title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
      } @else {
      <div class="youtube-empty">
        <span>Ingresa un enlace de YouTube para cargar el video.</span>
      </div>
      }
    </div>
  </div>
</div>
