<header [formGroup]="form" [class.view-only]="viewOnly">

  <div class="header-content">

    <ng-container *ngIf="viewOnly">

      <input type="hidden" id="songTitle" [value]="form.value.title || ''">
      <input type="hidden" id="songArtist" [value]="form.value.artist || ''">
      <input type="hidden" id="currentKey" [value]="form.value.key || 'C'">
      <input type="hidden" id="currentMode" [value]="form.value.mode || ''">
      <input type="hidden" id="songTempo" [value]="form.value.tempo || 72">
      <input type="hidden" id="songTime" [value]="form.value.time || '4/4'">

    </ng-container>

    <div class="meta-row" *ngIf="viewOnly && !hideMetadata">

      <span class="meta-label">Título:</span>
      <span class="meta-input w-title">
        {{ form.value.title || 'Sin título' }}
      </span>

      <span class="meta-label">Artista:</span>
      <span class="meta-input w-artist">
        {{ form.value.artist || 'Sin artista' }}
      </span>

      <span class="meta-label">Clave:</span>
      <span class="select-inp w-key">
        {{ form.value.key || 'C' }}{{ form.value.mode }}
      </span>

      <span class="meta-label">Tempo:</span>
      <span class="meta-input w-tempo">
        {{ form.value.tempo || 72 }}
      </span>

      <span class="meta-label">Compás:</span>
      <span class="select-inp w-time">
        {{ form.value.time || '4/4' }}
      </span>

    </div>

    <div class="meta-row" *ngIf="!viewOnly">

      <input class="meta-input w-title" formControlName="title" id="songTitle" placeholder="Título">

      <input class="meta-input w-artist" formControlName="artist" id="songArtist" placeholder="Artista">

      <span class="meta-label">Clave:</span>

      <select class="select-inp w-key" formControlName="key" id="currentKey">

        <option>Ab</option>
        <option>A</option>
        <option>A#</option>
        <option>Bb</option>
        <option>B</option>
        <option>C</option>
        <option>C#</option>
        <option>Db</option>
        <option>D</option>
        <option>D#</option>
        <option>Eb</option>
        <option>E</option>
        <option>F</option>
        <option>F#</option>
        <option>Gb</option>
        <option>G</option>
        <option>G#</option>

      </select>

      <select class="select-inp w-mode" formControlName="mode" id="currentMode">

        <option value="">Mayor</option>
        <option value="m">Menor</option>

      </select>

      <span class="meta-label">Tempo:</span>

      <input class="meta-input w-tempo" type="text" formControlName="tempo" id="songTempo">

      <span class="meta-label">Compás:</span>

      <input class="select-inp w-time" type="text" formControlName="time" id="songTime">

      <button class="btn btn-ghost" id="metronomeBtn" *ngIf="!hideMetronome" (click)="toggleMetronome.emit()">

        {{ isMetronomePlaying ? '■ Detener' : '♩ Iniciar' }}

      </button>

      <div class="metronome-volume" id="metronomeVolumeContainer" *ngIf="!hideMetronome">

        <label class="meta-label">Volumen:</label>

        <input type="range" min="0" max="100" formControlName="metronomeVolume" class="volume-slider"
          id="metronomeVolumeSlider">

        <span id="volumeValue">
          {{ form.value.metronomeVolume }}%
        </span>

      </div>

    </div>

    <div class="header-actions">

      <input *ngIf="!viewOnly" type="file" id="file-input" accept=".txt" style="display: none;"
        (change)="fileSelected.emit($event)">

      <label *ngIf="!viewOnly" for="file-input" class="btn btn-ghost">
        Importar
      </label>

      <button class="btn btn-ghost" (click)="showLoadSongDialog.emit()">

        <svg class="load-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 3v10.5m0 0 3.5-3.5m-3.5 3.5-3.5-3.5M4 14.5h4.5l1.3 2h4.4l1.3-2H20V19a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4.5Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" />
        </svg>
        Cargar

      </button>

      <button class="btn btn-ghost" (click)="openTranspose.emit()">

        <svg class="transpose-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.3" />
          <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.1" />
          <path d="M12 3v3M12 18v3M3 12h3m12 0h3M5.64 5.64l2.12 2.12m8.48 8.48 2.12 2.12m0-12.72-2.12 2.12m-8.48 8.48-2.12 2.12" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.1" />
          <path d="m12 8.8 2.4 3.2-2.4 3.2-2.4-3.2L12 8.8Z" fill="currentColor" />
        </svg>
        Transportar

      </button>

      <button class="btn btn-ghost" (click)="exportPDF.emit()">

        <svg class="adobe-logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="#eb1000" d="M1.5 22 9 2h3.4L5 22H1.5Zm21 0L15 2h-3.4L19 22h3.5ZM6.2 15.8h11.6l1.3 3.4H4.9l1.3-3.4Z" />
        </svg>
        PDF

      </button>

      <button class="btn btn-ghost" id="youtubeToggleBtn" *ngIf="!hideYoutube" (click)="toggleYoutubePanel.emit()"
        title="Mostrar video">

        <svg class="youtube-logo" viewBox="0 0 24 17" aria-hidden="true" focusable="false">
          <path fill="#ff0033" d="M23.5 2.7a3 3 0 0 0-2.1-2.1C19.6 0 12 0 12 0S4.4 0 2.6.6A3 3 0 0 0 .5 2.7 31.4 31.4 0 0 0 0 8.5s0 3.8.5 5.8a3 3 0 0 0 2.1 2.1c1.8.6 9.4.6 9.4.6s7.6 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 24 8.5s0-3.8-.5-5.8Z" />
          <path fill="#fff" d="m9.6 12 6.3-3.5-6.3-3.5V12Z" />
        </svg>
        YouTube

      </button>

      <button *ngIf="!viewOnly" class="btn btn-ghost" (click)="exportTXT.emit()">

        TXT

      </button>

      <button class="btn btn-ghost" *ngIf="!hideSave" (click)="saveSong.emit()">

        Guardar

      </button>

    </div>

  </div>

</header>
