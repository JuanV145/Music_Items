<app-song-header [form]="headerForm" [hideMetronome]="true" [hideYoutube]="true"
  [isMetronomePlaying]="isMetronomePlaying" (toggleMetronome)="toggleMetronome()"
  (fileSelected)="onFileSelected($event)" (openTranspose)="openTranspose()" (exportTXT)="exportTXT()"
  (exportPDF)="exportPDF()" (showLoadSongDialog)="showLoadSongDialog()" (saveSong)="saveSongToDB()">
</app-song-header>

<div class="workspace">

  <app-editor-panel [structureContent]="structureContent" [songContent]="songContent"
    (structureContentChange)="structureContent = $event" (songContentChange)="songContent = $event"
    (textChanged)="onEditorChange()">
  </app-editor-panel>

  <app-song-preview [data]="previewData" (statsChanged)="onPreviewStatsChanged($event)">
  </app-song-preview>

  <app-youtube-panel></app-youtube-panel>

</div>

<div class="status-bar">
  <span>
    Secciones: <b>{{ previewStats.sections }}</b>
  </span>

  <span>
    Líneas: <b>{{ previewStats.lines }}</b>
  </span>

  <span>
    Acordes únicos: <b>{{ previewStats.chords }}</b>
  </span>

  <span style="margin-left:auto;color:var(--accent2)">
    {{ statusService.message() }}
  </span>
</div>

<app-transpose-modal [open]="isTransposeOpen" [currentKey]="headerForm.get('key')?.value || 'C'"
  [currentMode]="headerForm.get('mode')?.value || ''" (cancel)="closeTranspose()" (applied)="applyTranspose($event)">
</app-transpose-modal>

<app-song-dialog *ngIf="showSongDialog" (songSelected)="onSongSelected($event)" (closed)="closeSongDialog()">
</app-song-dialog>
